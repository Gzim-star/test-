
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLY BOT SCANNER</title>
<style>
body {
  background:#090d13;
  color:#e8f0f8;
  font-family:Arial,sans-serif;
  padding:18px;
}
h1 {color:#00ffcc;letter-spacing:2px}
button {
  background:#00ffcc;
  border:0;
  padding:12px 20px;
  font-weight:bold;
  border-radius:7px;
}
.card {
  background:#151e29;
  border:1px solid #293849;
  border-radius:10px;
  padding:14px;
  margin:12px 0;
}
.price {color:#00ffcc}
small {color:#9aabba}
</style>
</head>
<body>

<h1>POLY BOT</h1>
<p>MARKET SCANNER · READ ONLY</p>

<button onclick="loadMarkets()">MARKETS SCANNEN</button>
<p id="status">Bereit zum Scannen.</p>
<div id="markets"></div>

<script>
async function loadMarkets() {
  const status = document.getElementById("status");
  const output = document.getElementById("markets");

  status.textContent = "Analysiere Märkte...";
  output.innerHTML = "";

  try {
    const url =
      "https://gamma-api.polymarket.com/markets" +
      "?active=true&closed=false&limit=30" +
      "&order=volume24hr&ascending=false";

    const response = await fetch(url);

    if (!response.ok) throw new Error("API Fehler");

    const data = await response.json();

    data.forEach(market => {
      let prices = market.outcomePrices;

      if (typeof prices === "string") {
        prices = JSON.parse(prices);
      }

      if (!Array.isArray(prices)) return;

      const yes = Number(prices[0]);
      const no = Number(prices[1]);

      if (!Number.isFinite(yes) ||
          !Number.isFinite(no)) return;

      const volume = Number(market.volume24hr || 0);
      const liquidity = Number(market.liquidityNum || 0);

      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("b");
      title.textContent = market.question || "Unbekannter Markt";

      const details = document.createElement("p");
      details.innerHTML =
        '<span class="price">YES: ' +
        (yes * 100).toFixed(1) + '%</span><br>' +
        '<span class="price">NO: ' +
        (no * 100).toFixed(1) + '%</span>';

      const info = document.createElement("small");
      info.textContent =
        "24h Volumen: $" + volume.toFixed(2) +
        " | Liquidität: $" + liquidity.toFixed(2);

      card.append(title, details, info);
      output.appendChild(card);
    });

    status.textContent =
      data.length + " Märkte analysiert.";

  } catch(error) {
    status.textContent =
      "Fehler: " + error.message;
  }
}
</script>

</body>
</html>
