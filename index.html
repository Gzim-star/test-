
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLY BOT V2</title>
<style>
body {
  background:#090d13;color:#e8f0f8;
  font-family:Arial,sans-serif;padding:16px
}
h1{color:#00ffcc;letter-spacing:3px}
button{background:#00ffcc;border:0;padding:13px;
border-radius:7px;font-weight:bold}
.card{background:#151e29;border:1px solid #293849;
padding:14px;border-radius:10px;margin:12px 0}
.price{color:#00ffcc}
small{color:#9aabba}
.tag{color:#ffcc00;font-size:12px}
</style>
</head>
<body>

<h1>POLY BOT V2</h1>
<p>CROSS-MARKET DETECTOR</p>
<button onclick="scan()">SCAN 100 MARKETS</button>
<p id="status">Scanner bereit.</p>

<h2>Ähnliche Märkte</h2>
<div id="results"></div>

<script>
const stop = new Set([
"will","the","and","for","from","with","that",
"this","what","when","who","how","does","is",
"be","by","in","on","of","to","a","an","or",
"before","after","than","over","under","reach"
]);

function parse(value) {
  try {
    return typeof value === "string"
      ? JSON.parse(value) : value;
  } catch(e) { return []; }
}

function words(question) {
  return new Set(
    question.toLowerCase()
      .replace(/[^a-z0-9 ]/g," ")
      .split(/\s+/)
      .filter(w => w.length > 2 && !stop.has(w))
  );
}

function compare(a,b) {
  const common = [...a.words].filter(
    w => b.words.has(w)
  );

  const union = new Set([...a.words,...b.words]);
  const similarity = common.length / union.size;

  return {common,similarity};
}

async function scan() {
  const status = document.getElementById("status");
  const results = document.getElementById("results");

  results.innerHTML = "";
  status.textContent = "Analysiere 100 Märkte...";

  try {
    const response = await fetch(
      "https://gamma-api.polymarket.com/markets" +
      "?active=true&closed=false&limit=100" +
      "&order=volume24hr&ascending=false"
    );

    if (!response.ok) throw new Error("API Fehler");

    const data = await response.json();

    const markets = data.map(m => {
      const prices = parse(m.outcomePrices);
      const outcomes = parse(m.outcomes);

      const yesIndex = outcomes.findIndex(
        x => String(x).toLowerCase() === "yes"
      );

      if (yesIndex < 0 || !prices[yesIndex]) return null;

      return {
        question:m.question,
        yes:Number(prices[yesIndex]),
        volume:Number(m.volume24hr || 0),
        liquidity:Number(m.liquidityNum || 0),
        words:words(m.question || "")
      };
    }).filter(m =>
      m && Number.isFinite(m.yes) &&
      m.words.size >= 2
    );

    const pairs = [];

    for(let i=0;i<markets.length;i++) {
      for(let j=i+1;j<markets.length;j++) {
        const a=markets[i], b=markets[j];
        const c=compare(a,b);

        if(c.common.length < 2 ||
           c.similarity < 0.25) continue;

        pairs.push({
          a,b,
          common:c.common,
          similarity:c.similarity,
          difference:Math.abs(a.yes-b.yes)
        });
      }
    }

    pairs.sort((x,y) =>
      y.similarity-x.similarity ||
      y.difference-x.difference
    );

    status.textContent =
      markets.length + " Märkte | " +
      pairs.length + " ähnliche Paare gefunden.";

    if(!pairs.length) {
      results.textContent =
        "Keine ausreichend ähnlichen Marktfragen gefunden.";
      return;
    }

    pairs.slice(0,20).forEach(p => {
      const card=document.createElement("div");
      card.className="card";

      const title=document.createElement("div");
      title.className="tag";
      title.textContent="MÖGLICHES MARKTPAAR";

      const q1=document.createElement("p");
      q1.textContent="A: "+p.a.question;

      const v1=document.createElement("div");
      v1.className="price";
      v1.textContent="YES: "+(p.a.yes*100).toFixed(1)+"%";

      const q2=document.createElement("p");
      q2.textContent="B: "+p.b.question;

      const v2=document.createElement("div");
      v2.className="price";
      v2.textContent="YES: "+(p.b.yes*100).toFixed(1)+"%";

      const info=document.createElement("small");
      info.textContent=
        "Gemeinsame Begriffe: "+p.common.join(", ")+
        " | Preisabstand: "+
        (p.difference*100).toFixed(1)+" Prozentpunkte"+
        " | Ähnlichkeit: "+
        (p.similarity*100).toFixed(0)+"%";

      card.append(title,q1,v1,q2,v2,info);
      results.appendChild(card);
    });

  } catch(error) {
    status.textContent="Fehler: "+error.message;
  }
}
</script>
</body>
</html>
