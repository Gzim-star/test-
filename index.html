<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Fall</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: black; overflow: hidden; touch-action: manipulation;
  overscroll-behavior: none; font-family: system-ui, sans-serif;
}
.game {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.hint { color: #fff; font-size: 24px; margin-bottom: 10px; font-family: monospace; }
canvas { background: #000; border: none !important; display: block; }
#introScreen {
  position: fixed; inset: 0; background: #000; display: flex;
  flex-direction: column; justify-content: center; align-items: center;
  z-index: 9999; opacity: 1; transition: opacity 0.8s ease;
}
.title {
  font-family: 'Press Start 2P', monospace; font-size: 32px; color: white;
  display: flex; gap: 6px;
}
.title span { opacity: 0; transform: translateY(20px); animation: reveal 0.6s ease forwards; }
.title span:nth-child(1) { animation-delay: 0.8s; }
.title span:nth-child(2) { animation-delay: 0.9s; }
.title span:nth-child(3) { animation-delay: 0.1s; }
.title span:nth-child(4) { animation-delay: 1.0s; }
.title span:nth-child(6) { animation-delay: 1.1s; }
.title span:nth-child(7) { animation-delay: 0.3s; }
.title span:nth-child(8) { animation-delay: 1.2s; }
.title span:nth-child(9) { animation-delay: 1.3s; }
.subtitle {
  margin-top: 25px; font-family: 'Press Start 2P', monospace; font-size: 10px;
  color: rgba(255,255,255,0.8); opacity: 0; animation: fadeSub 1s ease forwards;
  animation-delay: 1.2s; letter-spacing: 2px;
}
@keyframes reveal { to { opacity: 1; transform: translateY(0); } }
@keyframes fadeSub { to { opacity: 1; } }
.controls { margin-top: -10px; display: flex; gap: 10px; }
.controls button {
  background: black; color: white; border: 1px solid white;
  padding: 12px 16px; font-size: 18px; border-radius: 10px;
}
#mindMessage {
  position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%);
  color: white; font-family: 'Press Start 2P', monospace; font-size: 12px;
  opacity: 0; pointer-events: none; transition: opacity 1.5s;
}
.game .hint, .game canvas, .game #mindMessage, .game #roundDisplay,
.game .controls button { transition: opacity 0.8s ease; }
.game.void-hidden .hint, .game.void-hidden canvas, .game.void-hidden #mindMessage,
.game.void-hidden #roundDisplay, .game.void-hidden .controls button:not(:last-child) {
  opacity: 0 !important; pointer-events: none !important;
}
.game.void-hidden:not(.void-reset-visible) .controls button:last-child {
  opacity: 0 !important; pointer-events: none !important;
}
.game.void-hidden.void-reset-blink-hidden .controls button:last-child {
  opacity: 0 !important; pointer-events: none !important;
}
</style>
</head>
<body>
<div id="introScreen">
  <div class="title">
    <span>W</span><span>O</span><span>®</span><span>D</span>
    <span class="space"></span><span>F</span><span>@</span><span>L</span><span>L</span>
  </div>
  <div class="subtitle">GAME</div>
</div>

<div class="game">
  <div class="hint"><span id="wordHint" onclick="revealHint()" style="cursor:pointer;">Hint</span></div>
  <canvas id="wordFallCanvas" width="300" height="600"></canvas>
  <div id="mindMessage"></div>
  <div id="roundDisplay" style="position:relative;top:65px;color:white;font-family:monospace;font-size:12px;text-align:center;">0/10</div>
  <div class="controls">
    <button onclick="startGame()">START</button>
    <button onclick="move(-1)">◀</button>
    <button onclick="dropFast()">▼</button>
    <button onclick="move(1)">▶</button>
    <button onclick="restartGame()">RESET</button>
  </div>
</div>

<script>
/*
  Word Fall: Illusion
  Built by Gëzim Hasani
  Dedicated to Fadil Hasani
  A father never truly leaves
  what he helped build.
*/

// ===== DOUBLE TAP ZOOM KILLER =====
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// ===== CANVAS =====
const canvas = document.getElementById('wordFallCanvas');
const ctx = canvas.getContext('2d');
ctx.scale(30, 30);

// ===== NEXT ROUND FUTURISTIC TONE =====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playNextRoundTone() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(420, now);
  osc.frequency.linearRampToValueAtTime(620, now + 0.18);
  filter.type = "highpass";
  filter.frequency.setValueAtTime(900, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.04, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.22);
}

// ===== DICTIONARY =====
const WORDS = [
  'ABOMINABLE', 'REPOSITORY','EVERYTHING', 'REFRESHING', 'KNIGHTHOOD',
  'MASTERMIND', 'NIGHTSTAND','LEGENDARYS', 'WATERMELON', 'YELLOWHAZE',
  'DYNAMICS', 'ECLIPSES', 'FIREWALL', 'HORIZONS', 'JOURNEYS',
  'KEYSTONE', 'LANDMARK', 'MOUNTAIN', 'NOTEBOOK', 'OBELISKS',
  'PUZZLE', 'ORACLE', 'SYSTEM', 'PLAYER', 'TARGET',
  'BINARY', 'MODULE', 'VECTOR', 'RANDOM', 'CODING',
  'WORD', 'GAME', 'PLAY', 'TEST', 'DATA',
  'NODE', 'LINK', 'TASK', 'FLOW', 'CODE'
];
const MIN_LEN = 4;
const COLORS = ['#ffffff'];
let wordQueue = [];
let wordIndex = 0;
function shuffleWords() {
  wordQueue = [...WORDS];
  for (let i = wordQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [wordQueue[i], wordQueue[j]] = [wordQueue[j], wordQueue[i]];
  }
  wordIndex = 0;
}

// ===== ARENA / CORE STATE =====
const arena = Array.from({ length: 20 }, () => Array(10).fill(null));
const highlights = Array.from({ length: 20 }, () => Array(10).fill(null));
const player = { pos: { x: 0, y: 0 }, letter: '' };
let targetWord = '';
let gameRunning = false;
let hintRevealed = false;
let revealTimeout = null;
let frameX = 0, frameY = 0, frameH = 10;
let round = 1;
const maxRounds = 10;
let fakeFrames = [];
let pulseActive = false;
let fakePulseTriggered = false;
let fakePulseTimeout = null;
let fakePulseActive = false;
let fakePulseTime = 0;
let colorShiftTimeout = null;
let colorShiftIllusionTriggered = false;
let pulseTime = 0;
let pulseDuration = 300;
let framesInvisible = false;
let hintDisabled = false;
let mindMessageShown = false;
let round4InvisibleY = null;
let roundEffect = 'normal';

// ===== RANDOM DECEPTION SYSTEM =====
// Stage 1 is always normal. Each of these nine effects is used exactly once
// in stages 2-10. RESET creates a new shuffled order.
const DECEPTION_EFFECTS = [
  'fakePulse',       // Fake frame pulses
  'originalPulse',  // Original frame pulses
  'invisibleLetter', // One letter inside the original frame disappears
  'void',            // Screen disappears temporarily
  'invisibleFrames', // All frames disappear
  'fakePenalty',     // Choosing a fake frame sends the player back one stage
  'fakeCorrect',     // Only a fake frame is accepted
  'fakeHint',        // Hint briefly shows a false word
  'outsideFrames'    // Target word must be outside all frames
];
let deceptionOrder = [];

function shuffleDeceptions() {
  deceptionOrder = [...DECEPTION_EFFECTS];
  for (let i = deceptionOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deceptionOrder[i], deceptionOrder[j]] = [deceptionOrder[j], deceptionOrder[i]];
  }
}
function setRoundEffect() {
  roundEffect = round === 1 ? 'normal' : deceptionOrder[round - 2];
  hintDisabled = false;
  framesInvisible = false;
  round4InvisibleY = null;
  pulseActive = false;
  fakePulseActive = false;
  fakePulseTriggered = false;
  mindMessageShown = false;
  if (roundEffect === 'invisibleFrames') {
    setTimeout(() => {
      if (gameRunning && roundEffect === 'invisibleFrames') framesInvisible = true;
    }, 6000);
  }
  if (roundEffect === 'fakePulse') triggerFakeFramePulse();
  if (roundEffect === 'originalPulse') triggerOriginalFramePulse();
  if (roundEffect === 'void') startRoundVoid();
}

// ===== ROUND DISPLAY =====
function updateRoundDisplay() {
  const display = document.getElementById('roundDisplay');
  if (display) display.textContent = round + '/' + maxRounds;
}

// ===== VOID EFFECT (formerly fixed round 5) =====
const gameElement = document.querySelector('.game');
let voidTimers = [];
function clearVoidTimers() {
  voidTimers.forEach(timer => clearTimeout(timer));
  voidTimers = [];
}
function startRoundVoid() {
  clearVoidTimers();
  voidTimers.push(setTimeout(() => {
    if (!gameRunning || roundEffect !== 'void') return;
    gameElement.classList.add('void-hidden');
    voidTimers.push(setTimeout(() => gameElement.classList.add('void-reset-visible'), 6000));
    voidTimers.push(setTimeout(() => {
      gameElement.classList.add('void-reset-blink-hidden');
      voidTimers.push(setTimeout(() => gameElement.classList.remove('void-reset-blink-hidden'), 3000));
    }, 25000));
    voidTimers.push(setTimeout(() => {
      gameElement.classList.remove('void-hidden', 'void-reset-visible', 'void-reset-blink-hidden');
    }, 60000));
  }, 10000));
}
function resetVoid() {
  clearVoidTimers();
  gameElement.classList.remove('void-hidden', 'void-reset-visible', 'void-reset-blink-hidden');
}

// ===== FRAME COLORS =====
const originalFrameColors = ['#ffffff'];
let frameColor = originalFrameColors[0];
const fakeFrameColors = ['#ffffff'];
let shuffledFrameColors = [];
let colorIndex = 0;
function shuffleFrameColors() {
  shuffledFrameColors = [...fakeFrameColors];
  colorIndex = 0;
}
function nextFakeFrameColor() {
  if (!shuffledFrameColors.length || colorIndex >= shuffledFrameColors.length) {
    shuffleFrameColors();
  }
  return shuffledFrameColors[colorIndex++];
}

// ===== WORD / HINT =====
function getMaskedWord(word, currentRound) {
  if (currentRound <= 1) return word;
  const letters = word.split('');
  const hideCount = Math.min(currentRound - 1, letters.length - 2);
  const indexes = [];
  while (indexes.length < hideCount) {
    const i = Math.floor(Math.random() * letters.length);
    if (!indexes.includes(i)) indexes.push(i);
  }
  indexes.forEach(i => letters[i] = '_');
  return letters.join('');
}
function getFakeWord(originalWord) {
  const candidates = WORDS.filter(w => w.length === originalWord.length && w !== originalWord);
  if (!candidates.length) return originalWord;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function revealHint() {
  if (!gameRunning || hintDisabled || hintRevealed) return;
  hintRevealed = true;
  const hintEl = document.getElementById('wordHint');
  if (roundEffect === 'fakeHint') {
    hintEl.textContent = getFakeWord(targetWord);
    revealTimeout = setTimeout(() => {
      hintEl.textContent = targetWord;
      revealTimeout = setTimeout(() => {
        hintEl.textContent = getMaskedWord(targetWord, round);
        hintRevealed = false;
      }, 2000);
    }, 2000);
  } else {
    hintEl.textContent = targetWord;
    revealTimeout = setTimeout(() => {
      hintEl.textContent = getMaskedWord(targetWord, round);
      hintRevealed = false;
    }, 2000);
  }
}

// ===== FRAME PLACEMENT =====
function randomizeFrame() {
  frameX = Math.floor(Math.random() * arena[0].length);
  const minY = 5;
  const maxY = Math.max(minY + 1, arena.length - frameH);
  frameY = Math.floor(Math.random() * (maxY - minY)) + minY;
}
function generateFakeFrames() {
  fakeFrames = [];
  const fakeCount = round - 1;
  for (let i = 0; i < fakeCount; i++) {
    let fx, fy, valid = false, attempts = 0;
    while (!valid && attempts < 300) {
      attempts++;
      fx = Math.floor(Math.random() * arena[0].length);
      const minY = 5;
      const maxY = Math.max(minY + 1, arena.length - frameH);
      fy = Math.floor(Math.random() * (maxY - minY)) + minY;
      const overlapsOriginal = fx === frameX &&
        fy < frameY + frameH && fy + frameH > frameY;
      const overlapsFake = fakeFrames.some(f =>
        f.x === fx && fy < f.y + frameH && fy + frameH > f.y
      );
      if (!overlapsOriginal && !overlapsFake) valid = true;
    }
    if (valid) fakeFrames.push({ x: fx, y: fy, color: nextFakeFrameColor() });
  }
}
function newTargetWord() {
  if (wordQueue.length === 0 || wordIndex >= wordQueue.length) shuffleWords();
  targetWord = wordQueue[wordIndex++];
  frameH = targetWord.length < 10 ? targetWord.length : 10;
  const hintEl = document.getElementById('wordHint');
  hintEl.textContent = getMaskedWord(targetWord, round);
  hintRevealed = false;
  if (revealTimeout) clearTimeout(revealTimeout);
  randomizeFrame();
  generateFakeFrames();
  if (colorShiftTimeout) clearTimeout(colorShiftTimeout);
  colorShiftIllusionTriggered = false;
  colorShiftTimeout = setTimeout(triggerColorShiftIllusion, 5000);
}

// ===== COLOR-SHIFT ILLUSION =====
function triggerColorShiftIllusion() {
  if (round <= 1 || colorShiftIllusionTriggered) return;
  colorShiftIllusionTriggered = true;
  const allFrames = [
    ...fakeFrames,
    { x: frameX, y: frameY, isOriginal: true, color: frameColor }
  ];
  if (allFrames.length <= 1) return;
  const colors = allFrames.map(f => f.color);
  const shift = Math.floor(Math.random() * (colors.length - 1)) + 1;
  const shifted = colors.slice(shift).concat(colors.slice(0, shift));
  allFrames.forEach((f, i) => {
    if (f.isOriginal) frameColor = shifted[i];
    else f.color = shifted[i];
  });
}

// ===== PULSE EFFECTS =====
function triggerFakeFramePulse() {
  if (fakePulseTriggered || fakeFrames.length === 0) return;
  fakePulseTriggered = true;
  fakePulseTimeout = setTimeout(() => {
    if (!gameRunning || roundEffect !== 'fakePulse') return;
    fakePulseActive = true;
    fakePulseTime = 0;
  }, 6000);
}
function triggerOriginalFramePulse() {
  setTimeout(() => {
    if (!gameRunning || roundEffect !== 'originalPulse') return;
    pulseActive = true;
    pulseTime = 0;
  }, 6000);
}

// ===== GAME LOGIC =====
function collide(arenaGrid, activePlayer) {
  const { x, y } = activePlayer.pos;
  return y >= arenaGrid.length || x < 0 || x >= arenaGrid[0].length ||
    y < 0 || arenaGrid[y][x] !== null;
}
function merge(arenaGrid, activePlayer) {
  arenaGrid[activePlayer.pos.y][activePlayer.pos.x] = activePlayer.letter;
  if (roundEffect === 'invisibleLetter' && activePlayer.pos.x === frameX &&
      activePlayer.pos.y >= frameY && activePlayer.pos.y < frameY + frameH) {
    round4InvisibleY = activePlayer.pos.y;
  }
}
function move(dir) {
  if (!gameRunning) return;
  player.pos.x += dir;
  if (collide(arena, player)) player.pos.x -= dir;
}
function drop() {
  if (!gameRunning) return;
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    checkAndClearWords();
    clearDiagonalSixByColor();
    resetPlayer();
  }
}

// ===== WORD DETECTION =====
function checkAndClearWords() {
  clearHighlights();
  const found = findWords();
  if (!found.length) return;
  let targetFound = false;
  let fakeFrameHit = false;

  found.forEach(group => {
    const letters = group.map(([y, x]) => arena[y][x]).join('');
    if (letters.toUpperCase() === targetWord) {
      const inOriginalFrame = group.every(([y, x]) =>
        x === frameX && y >= frameY && y < frameY + frameH
      );
      const inFakeFrame = fakeFrames.some(f =>
        group.every(([y, x]) => x === f.x && y >= f.y && y < f.y + frameH)
      );

      if (roundEffect === 'outsideFrames') {
        if (!inOriginalFrame && !inFakeFrame) targetFound = true;
      } else if (roundEffect === 'fakeCorrect') {
        if (inFakeFrame) targetFound = true;
      } else {
        if (inOriginalFrame) targetFound = true;
        if (inFakeFrame && roundEffect === 'fakePenalty') fakeFrameHit = true;
      }
    }
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    group.forEach(([y, x]) => highlights[y][x] = color);
  });

  setTimeout(() => {
    if (fakeFrameHit && !targetFound) {
      // Penalty effect: restart the current stage's board, but do not repeat
      // or consume another deception.
      arena.forEach(r => r.fill(null));
      clearHighlights();
      resetPlayer();
      newTargetWord();
      return;
    }

    if (targetFound) {
      framesInvisible = false;
      playNextRoundTone();
      arena.forEach(r => r.fill(null));
      clearHighlights();
      resetPlayer();
      resetVoid();

      round++;
      if (round > maxRounds) {
        round = 1;
        shuffleDeceptions();
      }
      setRoundEffect();
      updateRoundDisplay();
      frameColor = originalFrameColors[0];
      dropInterval = Math.max(200, 700 - (round * 60));
      pulseActive = false;
      fakePulseActive = false;
      colorShiftIllusionTriggered = false;
      newTargetWord();
      // Fake-frame pulse needs the newly created frames.
      if (roundEffect === 'fakePulse') triggerFakeFramePulse();
      return;
    }

    found.flat().forEach(([y, x]) => arena[y][x] = null);
    applyGravity();
    clearHighlights();
  }, 300);
}

function findWords() {
  const found = [];
  for (let y = 0; y < arena.length; y++) {
    let word = '', pos = [];
    for (let x = 0; x <= arena[0].length; x++) {
      const c = arena[y][x];
      if (c) { word += c; pos.push([y, x]); }
      else { extract(word, pos, found); word = ''; pos = []; }
    }
  }
  for (let x = 0; x < arena[0].length; x++) {
    let word = '', pos = [];
    for (let y = 0; y <= arena.length; y++) {
      const c = arena[y]?.[x];
      if (c) { word += c; pos.push([y, x]); }
      else { extract(word, pos, found); word = ''; pos = []; }
    }
  }
  return found;
}
function extract(word, pos, found) {
  if (word.length < MIN_LEN) return;
  const upperWord = word.toUpperCase();
  WORDS.forEach(w => {
    const i = upperWord.indexOf(w);
    if (i !== -1) found.push(pos.slice(i, i + w.length));
  });
}
function clearDiagonalSixByColor() {
  const toClear = [];
  for (let y = arena.length - 1; y >= 0; y--) {
    for (let x = 0; x < arena[0].length; x++) {
      if (!arena[y][x]) continue;
      const baseColor = COLORS[(x + y) % COLORS.length];
      const chain = [[y, x]];
      let ny = y - 1, nx = x + 1;
      while (ny >= 0 && nx < arena[0].length && arena[ny][nx] &&
        COLORS[(nx + ny) % COLORS.length] === baseColor) {
        chain.push([ny, nx]); ny--; nx++;
      }
      if (chain.length >= 4) chain.forEach(p => toClear.push(p));
    }
  }
  if (!toClear.length) return;
  toClear.forEach(([y, x]) => highlights[y][x] = '#ff3333');
  setTimeout(() => {
    toClear.forEach(([y, x]) => arena[y][x] = null);
    applyGravity();
    clearHighlights();
  }, 250);
}

// ===== GRAVITY =====
function applyGravity() {
  for (let x = 0; x < arena[0].length; x++) {
    for (let y = arena.length - 1; y >= 0; y--) {
      if (arena[y][x] === null) {
        for (let k = y - 1; k >= 0; k--) {
          if (arena[k][x] !== null) {
            arena[y][x] = arena[k][x];
            arena[k][x] = null;
            break;
          }
        }
      }
    }
  }
}

// ===== PLAYER =====
function randomLetter() {
  return String.fromCharCode(65 + Math.floor(Math.random() * 26));
}
function resetPlayer() {
  player.letter = randomLetter();
  player.pos.y = 0;
  player.pos.x = Math.floor(arena[0].length / 2);
  if (collide(arena, player)) arena.forEach(r => r.fill(null));
}

// ===== FALLING LETTERS PREVIEW =====
function startFallingLettersPreview() {
  startFallingIntroText();
  const letters = [];
  const columns = arena[0].length;
  const rows = Math.floor(arena.length / 2);
  const colors = COLORS;
  for (let x = 0; x < columns; x++) {
    for (let y = 0; y < rows; y++) {
      letters.push({
        x, y: -Math.random() * rows,
        letter: String.fromCharCode(65 + Math.floor(Math.random() * 26)),
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: 0.05 + Math.random() * 0.15,
        scale: 1 + Math.random() * 0.5
      });
    }
  }
  function animFrame() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    letters.forEach(l => {
      const scale = 1 + 0.3 * Math.sin(Date.now() * 0.005 + l.x);
      ctx.save();
      ctx.translate(l.x + 0.5, l.y + 0.5);
      ctx.scale(scale, scale);
      ctx.fillStyle = l.color;
      ctx.font = '1px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.letter, 0, 0);
      ctx.restore();
      l.y += l.speed;
      if (l.y >= arena.length) l.y = arena.length;
    });
    window.previewAnim = requestAnimationFrame(animFrame);
  }
  animFrame();
}

// ===== FALLING INTRO TEXT PREVIEW =====
function startFallingIntroText() {
  const oldOverlay = document.getElementById('introPreviewOverlay');
  if (oldOverlay) oldOverlay.remove();
  const rect = canvas.getBoundingClientRect();
  const overlay = document.createElement('div');
  overlay.id = 'introPreviewOverlay';
  Object.assign(overlay.style, {
    position: 'fixed', left: rect.left + 'px', top: rect.top + 'px',
    width: rect.width + 'px', height: rect.height + 'px',
    background: 'transparent', color: '#fff', overflow: 'hidden',
    zIndex: '10', fontFamily: 'monospace', boxSizing: 'border-box'
  });
  document.body.appendChild(overlay);
  function syncIntroOverlay() {
    const r = canvas.getBoundingClientRect();
    overlay.style.left = r.left + 'px';
    overlay.style.top = r.top + 'px';
    overlay.style.width = r.width + 'px';
    overlay.style.height = r.height + 'px';
  }
  window.addEventListener('resize', syncIntroOverlay);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncIntroOverlay);
    window.visualViewport.addEventListener('scroll', syncIntroOverlay);
  }
  const lines = [
    'Not everything is', 'what it seems.', '',
    'Word Fall is more than', 'a word game.',
    'It is a challenge of', 'attention, perception,',
    'and concentration.', '',
    'Letters fall. Words appear.', 'Frames compete for',
    'your attention.', 'What seems obvious may',
    'not be correct, and what', 'looks familiar may deceive you.', '',
    'With every round,', 'the challenge changes.',
    'Your eyes search for patterns,', 'your mind looks for answers,',
    'and your confidence is', 'put to the test.', '',
    'There is no guarantee', 'that what you see is',
    'what you think it is.', '',
    'Observe carefully.', 'Think clearly.',
    'Trust your perception', '— but question it.', '',
    'Can you see beyond', 'the illusion?', '',
    'Built by Gëzim Hasani'
  ];
  const fontSize = Math.max(12, Math.min(13, rect.width / 34));
  const lineHeight = fontSize * 1.20;
  const totalHeight = lines.length * lineHeight;
  const startY = Math.max(8, (rect.height - totalHeight) / 2);
  const letters = [];
  lines.forEach((line, row) => {
    const lineWidth = line.length * fontSize * 0.6;
    const startX = Math.max(4, (rect.width - lineWidth) / 2);
    [...line].forEach((char, col) => {
      if (char === ' ') return;
      const span = document.createElement('span');
      span.textContent = char;
      Object.assign(span.style, {
        position: 'absolute',
        left: (startX + col * fontSize * 0.6) + 'px',
        top: '0px', fontSize: fontSize + 'px',
        lineHeight: lineHeight + 'px', whiteSpace: 'pre', opacity: '0'
      });
      overlay.appendChild(span);
      letters.push({
        element: span, targetY: startY + row * lineHeight,
        y: -20 - Math.random() * rect.height,
        speed: 160 + Math.random() * 180, delay: Math.random() * 2
      });
    });
  });
  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  let startTime = null, lastTime = null;
  function animate(timestamp) {
    if (!document.getElementById('introPreviewOverlay')) return;
    if (startTime === null) startTime = timestamp;
    if (lastTime === null) lastTime = timestamp;
    const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
    const elapsed = (timestamp - startTime) / 1000;
    lastTime = timestamp;
    let allLanded = true;
    letters.forEach(letter => {
      if (elapsed < letter.delay) { allLanded = false; return; }
      if (letter.y < letter.targetY) {
        letter.y = Math.min(letter.targetY, letter.y + letter.speed * delta);
      }
      letter.element.style.top = letter.y + 'px';
      letter.element.style.opacity = '1';
      if (letter.y < letter.targetY) allLanded = false;
    });
    if (!allLanded) window.introTextAnim = requestAnimationFrame(animate);
    else window.introTextAnim = null;
  }
  window.introTextAnim = requestAnimationFrame(animate);
}

// ===== DRAW =====
function clearHighlights() { highlights.forEach(r => r.fill(null)); }
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = '1px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (!gameRunning) return;

  let borderWidth = 0.05, alpha = 1;
  if (pulseActive) {
    pulseTime += 16;
    const progress = pulseTime / pulseDuration;
    if (progress >= 1) pulseActive = false;
    else {
      borderWidth = 0.05 + Math.sin(progress * Math.PI) * 0.08;
      alpha = 1 + Math.sin(progress * Math.PI) * 0.5;
    }
  }
  if (!framesInvisible) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(frameX + 0.05, frameY - 0.27, 0.9, frameH - 0.2);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = frameColor || '#ffffff';
    ctx.lineWidth = borderWidth;
    ctx.strokeRect(frameX + 0.05, frameY - 0.27, 0.9, frameH - 0.2);
    ctx.globalAlpha = 1;

    fakeFrames.forEach(f => {
      let fakeBorderWidth = 0.05, fakeAlpha = 1;
      if (fakePulseActive) {
        fakePulseTime += 16;
        const progress = fakePulseTime / pulseDuration;
        if (progress >= 1) fakePulseActive = false;
        else {
          fakeBorderWidth = 0.05 + Math.sin(progress * Math.PI) * 0.08;
          fakeAlpha = 1 + Math.sin(progress * Math.PI) * 0.5;
        }
      }
      ctx.fillStyle = '#000000';
      ctx.globalAlpha = fakeAlpha;
      ctx.strokeStyle = f.color || '#ffffff';
      ctx.lineWidth = fakeBorderWidth;
      ctx.fillRect(f.x + 0.05, f.y - 0.27, 0.9, frameH - 0.2);
      ctx.strokeRect(f.x + 0.05, f.y - 0.27, 0.9, frameH - 0.2);
      ctx.globalAlpha = 1;
    });
  }

  arena.forEach((row, y) => {
    row.forEach((v, x) => {
      if (v) {
        if (roundEffect === 'invisibleLetter' && x === frameX && y === round4InvisibleY) return;
        ctx.fillStyle = highlights[y][x] || COLORS[(x + y) % COLORS.length];
        ctx.fillText(v, x + 0.5, y + 0.5);
      }
    });
  });
  ctx.fillStyle = COLORS[(player.pos.x + player.pos.y) % COLORS.length];
  ctx.fillText(player.letter, player.pos.x + 0.5, player.pos.y + 0.5);
}

// ===== LOOP =====
let lastTime = 0, dropCounter = 0, dropInterval = 700;
function update(time = 0) {
  const delta = time - lastTime;
  lastTime = time;
  if (gameRunning) {
    dropCounter += delta;
    if (dropCounter > dropInterval) { drop(); dropCounter = 0; }
  }
  draw();
  requestAnimationFrame(update);
}

// ===== INPUT =====
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'ArrowDown') drop();
});

// ===== BUTTONS =====
function startGame() {
  if (window.introTextAnim) {
    cancelAnimationFrame(window.introTextAnim);
    window.introTextAnim = null;
  }
  document.getElementById('introPreviewOverlay')?.remove();
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (window.previewAnim) {
    cancelAnimationFrame(window.previewAnim);
    window.previewAnim = null;
  }
  if (!gameRunning) {
    shuffleFrameColors();
    shuffleDeceptions();
    round = 1;
    setRoundEffect();
    gameRunning = true;
    resetPlayer();
    newTargetWord();
    updateRoundDisplay();
  }
}

function restartGame() {
  resetVoid();
  round = 1;
  shuffleDeceptions();
  frameColor = originalFrameColors[0];
  hintDisabled = false;
  hintRevealed = false;
  pulseActive = false;
  fakePulseActive = false;
  fakePulseTriggered = false;
  framesInvisible = false;
  round4InvisibleY = null;
  mindMessageShown = false;
  if (revealTimeout) clearTimeout(revealTimeout);
  if (colorShiftTimeout) clearTimeout(colorShiftTimeout);
  if (fakePulseTimeout) clearTimeout(fakePulseTimeout);
  arena.forEach(r => r.fill(null));
  clearHighlights();
  shuffleFrameColors();
  colorIndex = 0;
  setRoundEffect();
  newTargetWord();
  resetPlayer();
  dropCounter = 0;
  dropInterval = 700;
  gameRunning = true;
  updateRoundDisplay();
}

function dropFast() {
  if (!gameRunning) return;
  while (!collide(arena, player)) player.pos.y++;
  player.pos.y--;
  merge(arena, player);
  checkAndClearWords();
  clearDiagonalSixByColor();
  resetPlayer();
}

// ===== INIT =====
setTimeout(() => {
  const intro = document.getElementById('introScreen');
  intro.style.opacity = '0';
  setTimeout(() => {
    intro.style.display = 'none';
    startFallingLettersPreview();
  }, 800);
}, 5000);

if (wordQueue.length === 0) shuffleWords();

const messages = ["ARE YOU SURE?", "LOOK AGAIN", "TRUST NOTHING"];
setInterval(() => {
  if (roundEffect === 'invisibleFrames' && !mindMessageShown && gameRunning) {
    const msg = document.getElementById('mindMessage');
    msg.textContent = messages[Math.floor(Math.random() * messages.length)];
    msg.style.opacity = 1;
    setTimeout(() => { msg.style.opacity = 0; }, 2500);
    mindMessageShown = true;
  }
}, 120000);

update();
</script>
