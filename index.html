
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POLY BOT V3</title>
<style>
body{background:#090d13;color:#e8f0f8;font-family:Arial;padding:16px}
h1{color:#00ffcc;letter-spacing:3px}
button{background:#00ffcc;border:0;padding:14px;border-radius:8px;font-weight:bold}
.card{background:#151e29;border:1px solid #293849;border-radius:10px;padding:14px;margin:12px 0}
.good{color:#00ff99}.warn{color:#ffcc00}.muted{color:#9aabba}
.big{font-size:25px;color:#00ffcc}
</style>
</head>
<body>

<h1>POLY BOT V3</h1>
<p>STRICT ARBITRAGE DETECTOR</p>
<p class="muted">READ ONLY · NO WALLET · NO TRADES</p>

<button onclick="scan()">START ARBITRAGE SCAN</button>
<p id="status">Scanner bereit.</p>
<div id="results"></div>

<script>
const API="https://gamma-api.polymarket.com";
const CLOB="https://clob.polymarket.com";

function parse(v){
 try{return typeof v==="string"?JSON.parse(v):v}
 catch(e){return []}
}

async function get(url){
 const r=await fetch(url);
 if(!r.ok)throw Error("HTTP "+r.status);
 return r.json();
}

async function book(token){
 return get(CLOB+"/book?token_id="+encodeURIComponent(token));
}

async function fee(token){
 return get(CLOB+"/fee-rate?token_id="+encodeURIComponent(token));
}

function bestAsk(book){
 const asks=(book.asks||[])
 .map(x=>({price:Number(x.price),size:Number(x.size)}))
 .filter(x=>x.price>0&&x.size>0)
 .sort((a,b)=>a.price-b.price);

 return asks[0]||null;
}

function show(title,body){
 const card=document.createElement("div");
 card.className="card";

 const h=document.createElement("h3");
 h.textContent=title;

 const p=document.createElement("div");
 p.innerHTML=body;

 card.append(h,p);
 document.getElementById("results").append(card);
}

async function scan(){
 const status=document.getElementById("status");
 const results=document.getElementById("results");

 results.innerHTML="";
 status.textContent="Lade Märkte...";

 try{
  const markets=await get(
   API+"/markets?active=true&closed=false"+
   "&limit=30&order=volume24hr&ascending=false"
  );

  let checked=0;
  let candidates=0;
  let skipped=0;

  status.textContent="Prüfe echte Orderbücher...";

  for(let i=0;i<markets.length;i+=3){
   const batch=markets.slice(i,i+3);

   await Promise.all(batch.map(async m=>{
    try{
     const ids=parse(m.clobTokenIds);
     const outcomes=parse(m.outcomes);

     if(!Array.isArray(ids)||ids.length!==2||
        !Array.isArray(outcomes)||outcomes.length!==2)
       return;

     const yi=outcomes.findIndex(
       x=>String(x).toLowerCase()==="yes");
     const ni=outcomes.findIndex(
       x=>String(x).toLowerCase()==="no");

     if(yi<0||ni<0)return;

     const [yb,nb,yf,nf]=await Promise.all([
       book(ids[yi]),book(ids[ni]),
       fee(ids[yi]),fee(ids[ni])
     ]);

     checked++;

     // Nur gebührenfreie Märkte zulassen.
     if(Number(yf.base_fee)!==0||
        Number(nf.base_fee)!==0){
       skipped++;
       return;
     }

     const ya=bestAsk(yb);
     const na=bestAsk(nb);

     if(!ya||!na)return;

     // Beide Kaufseiten müssen ausreichend Liquidität haben.
     const quantity=Math.min(ya.size,na.size);
     const minimum=Math.max(
       Number(yb.min_order_size||0),
       Number(nb.min_order_size||0)
     );

     if(quantity<minimum)return;

     const total=ya.price+na.price;
     const edge=1-total;

     if(edge<=0)return;

     const investment=quantity*total;
     const payout=quantity;
     const profit=payout-investment;

     candidates++;

     show(
       "THEORETISCHER ARBITRAGE-KANDIDAT",
       '<p class="good">'+
       m.question.replace(/</g,"&lt;")+
       '</p>'+
       '<p>YES Kaufpreis: '+ya.price.toFixed(4)+
       ' $</p>'+
       '<p>NO Kaufpreis: '+na.price.toFixed(4)+
       ' $</p>'+
       '<p>Gemeinsamer Kaufpreis: '+total.toFixed(4)+
       ' $</p>'+
       '<p class="big">+'+(edge*100).toFixed(2)+
       '% Bruttomarge</p>'+
       '<p>Gemeinsame Stückzahl: '+quantity.toFixed(4)+
       '</p>'+
       '<p>Kapitalbedarf: $'+investment.toFixed(4)+
       '</p>'+
       '<p class="good">Theoretischer Gewinn: $'+
       profit.toFixed(4)+'</p>'+
       '<p class="warn">Noch keine Ausführungsgarantie.</p>'
     );

    }catch(e){
      skipped++;
    }
   }));

   status.textContent=
    "Geprüft: "+checked+
    " | Kandidaten: "+candidates+
    " | Übersprungen: "+skipped;
  }

  if(candidates===0){
   show("Keine Arbitrage gefunden",
        "In den geprüften Märkten wurde keine passende Kombination gefunden.");
  }

  status.textContent+=" | Scan abgeschlossen.";

 }catch(e){
  status.textContent="Fehler: "+e.message;
 }
}
</script>
</body>
</html>
